name: SignPath signing

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to build and sign (must match package.json)
        required: true
        default: '0.1.1'

permissions:
  actions: read
  contents: read

jobs:
  sign:
    name: Build, sign and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '${{ inputs.version }}') {
            throw "package.json version is $($pkg.version), but the workflow was asked to sign ${{ inputs.version }}. Bump the version and tag it first."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Build unsigned NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: frameblade-${{ inputs.version }}-unsigned
          path: release/Frameblade-${{ inputs.version }}-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ inputs.version }}"

      - name: Verify signed installer and build checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem signed -Recurse -Filter 'Frameblade-*-Setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'SignPath did not return a Frameblade installer.'
          }

          $sig = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate

          if ($sig.Status -ne 'Valid') {
            throw "Signature is not valid: $($sig.Status) - $($sig.StatusMessage)"
          }
          if (-not $sig.SignerCertificate) {
            throw 'No signer certificate was returned.'
          }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Unexpected signer certificate: $($sig.SignerCertificate.Subject)"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw 'The signature is not timestamped.'
          }

          npm run source:zip
          if ($LASTEXITCODE -ne 0) {
            throw "Source snapshot failed with exit code $LASTEXITCODE."
          }

          $sourceZip = Join-Path $PWD "release\Frameblade-${{ inputs.version }}-source.zip"
          if (-not (Test-Path -LiteralPath $sourceZip)) {
            throw "Source snapshot is missing: $sourceZip"
          }

          New-Item -ItemType Directory -Force -Path signed-release | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination signed-release -Force
          Copy-Item -LiteralPath $sourceZip -Destination signed-release -Force

          $lines = @()
          foreach ($file in @($installer.FullName, $sourceZip)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -LiteralPath signed-release/SHA256SUMS.txt -Encoding ascii
          Get-Content signed-release/SHA256SUMS.txt

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: frameblade-${{ inputs.version }}-signed
          path: |
            signed-release/Frameblade-${{ inputs.version }}-Setup.exe
            signed-release/Frameblade-${{ inputs.version }}-source.zip
            signed-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Signing request link
        shell: pwsh
        run: |
          Write-Host "Signing request: ${{ steps.sign.outputs.signing-request-web-url }}"
