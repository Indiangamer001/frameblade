name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run unit tests
        run: npm test

      - name: Build NSIS installer
        run: npm run dist

      - name: Build source archive
        run: npm run source:zip

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Frameblade-*-Setup.exe
            release/Frameblade-*-source.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
